services:
  spark-master:
    build:
      context: ../../
      dockerfile: example/spark/Dockerfile
    image: poussins-spark:latest
    container_name: spark-master
    command: >
      bash -c "/opt/spark/sbin/start-master.sh && tail -f /dev/null"
    environment:
      - PYSPARK_PYTHON=python3.14
      - PYSPARK_DRIVER_PYTHON=python3.14
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-net

  spark-worker-1:
    image: poussins-spark:latest
    container_name: spark-worker-1
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"
    environment:
      - PYSPARK_PYTHON=python3.14
      - PYSPARK_DRIVER_PYTHON=python3.14
    depends_on:
      - spark-master
    networks:
      - spark-net

  spark-worker-2:
    image: poussins-spark:latest
    container_name: spark-worker-2
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"
    environment:
      - PYSPARK_PYTHON=python3.14
      - PYSPARK_DRIVER_PYTHON=python3.14
    depends_on:
      - spark-master
    networks:
      - spark-net

  spark-worker-3:
    image: poussins-spark:latest
    container_name: spark-worker-3
    command: >
      bash -c "/opt/spark/sbin/start-worker.sh spark://spark-master:7077 && tail -f /dev/null"
    environment:
      - PYSPARK_PYTHON=python3.14
      - PYSPARK_DRIVER_PYTHON=python3.14
    depends_on:
      - spark-master
    networks:
      - spark-net

networks:
  spark-net:
    driver: bridge
