[project]
name = "poussins"
version = "0.4.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
description = "A proof assistant running on Python."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.urls]
Documentation = "https://github.com/kumo01GitHub/poussins/blob/main/docs/proof-author-guide.md"
Repository = "https://github.com/kumo01GitHub/poussins.git"
Issues = "https://github.com/kumo01GitHub/poussins/issues"
Changelog = "https://github.com/kumo01GitHub/poussins/blob/main/CHANGELOG.md"

[project.optional-dependencies]
spark = [
    "pyspark>=4",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "SIM",
    "S",
    "N",
    "C4",
    "PL",
    "D",
    # "RUF",
]

ignore = []

[tool.ruff.lint.pylint]
max-returns = 15
max-branches = 50
max-args = 10
max-statements = 150

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "poussins._poussins"

[dependency-groups]
dev = [
    "maturin>=1.16.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
]
